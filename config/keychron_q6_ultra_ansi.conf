# ==========================================================
# Keychron標準ファームウェアには存在しない追記です。
#
# 目的: 公式ファームと同じバージョン番号(v1.0.4)のままだと、
# Launcher/デバイス側が「既に同じバージョンが入っている」と判断し、
# 書き込みが実質的にスキップされてしまう(「成功」と表示されるが
# 中身が反映されない)問題が発生したため、バージョン番号を
# 意図的に引き上げて区別できるようにする。
#
# 元の値(Keychronオリジナル、keychron_q6_ultra_ansi.conf内):
#   CONFIG_BT_DIS_FW_REV_STR="v1.0.4"
# ==========================================================
CONFIG_BT_DIS_FW_REV_STR="v1.0.9"
CONFIG_JIS_OVERRIDE=y
