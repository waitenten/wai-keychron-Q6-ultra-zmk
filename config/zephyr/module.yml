# ==========================================================
# Keychron/ZMK標準には存在しない追記です。
#
# このファイルにより、このリポジトリ自体が「Zephyrモジュール」
# として認識され、module/jis_override 以下の独自Cコードが
# ビルドに組み込まれるようになります。Keychronの本体リポジトリ
# には一切手を加えていません。
# ==========================================================
name: jis_override
build:
  cmake: module/jis_override
  kconfig: module/jis_override/Kconfig
