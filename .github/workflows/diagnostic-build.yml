name: Diagnostic - replicate community build method
on:
  workflow_dispatch:

# ==========================================================
# これは本番のビルドには使わない、検証専用のワークフローです。
#
# 目的: Redditで報告されている成功者(CalcProgrammer1氏、
# Peter Mortensen氏)のビルド方法を、ZMK_CONFIG方式ではなく
# そのまま再現し、生成される .bin が私たちの通常ビルド
# (build.yml, ZMK_CONFIG方式)と本当に違うのか確認する。
#
# 成功者の実際のコマンド:
#   git clone -b <branch> https://github.com/keychron/zmk.git
#   cd zmk
#   west init -l app/
#   west update
#   cd app
#   west build -p -b keychron -- -DSHIELD=keychron_q6_ultra_ansi
#
# ポイント: -DZMK_CONFIG は一切使わず、keymapファイルは
# Keychron本体のシールドフォルダを「直接上書き」してビルドする。
# ==========================================================

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:3.5-branch
    steps:
      - name: Checkout our config repo (for our keymap content only)
        uses: actions/checkout@v4
        with:
          path: our-config

      - name: Clone Keychron/zmk (full, community-style)
        run: git clone -b rtl8762g https://github.com/Keychron/zmk.git zmk

      - name: West Init (self = zmk/app, no ZMK_CONFIG involved)
        working-directory: zmk
        run: west init -l app

      - name: West Update
        working-directory: zmk
        run: west update --fetch-opt=--filter=tree:0

      - name: West Zephyr export
        working-directory: zmk
        run: west zephyr-export

      - name: Overwrite the shield's own keymap in-place with our content
        run: |
          cp our-config/config/keychron_q6_ultra_ansi.keymap \
             zmk/app/boards/shields/keychron_q6_ultra_ansi/keychron_q6_ultra_ansi.keymap
          echo "--- diff確認(差分が無ければ完全に同一内容) ---"
          diff our-config/config/keychron_q6_ultra_ansi.keymap \
               zmk/app/boards/shields/keychron_q6_ultra_ansi/keychron_q6_ultra_ansi.keymap && echo "内容は完全一致"

      - name: West Build (community-style, no ZMK_CONFIG, no -d)
        working-directory: zmk/app
        run: |
          west build -p -b keychron -- -DSHIELD=keychron_q6_ultra_ansi

      - name: Show header bytes for comparison
        run: |
          echo "=== community-style build zmk.bin header ==="
          od -A x -t x1z zmk/app/build/zephyr/zmk.bin | head -35
          echo ""
          ls -la zmk/app/build/zephyr/zmk.bin
          echo "=== sha256 ==="
          sha256sum zmk/app/build/zephyr/zmk.bin

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          cp zmk/app/build/zephyr/zmk.bin artifacts/community-style-zmk.bin

      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-community-style-build
          path: artifacts
